<!--
  Pairing wizard voor de OV-pas.
  Alle teksten komen uit /locales/*.json via Homey.__() zodat het scherm
  meertalig is (EN + NL), net als de rest van de app-metadata.
-->
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  .field { margin-bottom: 14px; }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  input {
    width: 100%; box-sizing: border-box; padding: 10px;
    border: 1px solid #ccc; border-radius: 8px; font-size: 15px;
  }
  .hint { color: #888; font-size: 12px; margin-top: 4px; }
  button {
    width: 100%; padding: 12px; font-size: 16px; font-weight: 600;
    border: 0; border-radius: 10px; background: #e6007e; color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #message { margin-top: 12px; font-size: 14px; min-height: 18px; }
  .error { color: #c0392b; }
  .ok { color: #218838; }
</style>

<div class="field">
  <label id="lbl-name" for="name"></label>
  <input id="name" type="text" placeholder="OV-Pas Jan" />
  <div class="hint" id="hint-name"></div>
</div>

<div class="field">
  <label id="lbl-cardnumber" for="cardNumber"></label>
  <input id="cardNumber" type="text" placeholder="A12BCDE" autocapitalize="characters" />
  <div class="hint" id="hint-cardnumber"></div>
</div>

<div class="field">
  <label id="lbl-sequence" for="cardSequenceNumber"></label>
  <input id="cardSequenceNumber" type="text" placeholder="A1BC" autocapitalize="characters" />
  <div class="hint" id="hint-sequence"></div>
</div>

<button id="submit" type="button"></button>
<div id="message"></div>

<script type="application/javascript">
  const $ = (id) => document.getElementById(id);

  // Vertalingen toepassen op de statische teksten.
  $('lbl-name').textContent = Homey.__('pair.name_label');
  $('hint-name').textContent = Homey.__('pair.name_hint');
  $('lbl-cardnumber').textContent = Homey.__('pair.card_number_label');
  $('hint-cardnumber').textContent = Homey.__('pair.card_number_hint');
  $('lbl-sequence').textContent = Homey.__('pair.sequence_label');
  $('hint-sequence').textContent = Homey.__('pair.sequence_hint');
  $('submit').textContent = Homey.__('pair.submit');

  function setMessage(text, cls) {
    const m = $('message');
    m.textContent = text;
    m.className = cls || '';
  }

  async function onSubmit() {
    const name = $('name').value.trim();
    const cardNumber = $('cardNumber').value.trim().toUpperCase();
    const cardSequenceNumber = $('cardSequenceNumber').value.trim().toUpperCase();

    if (!name || !cardNumber || !cardSequenceNumber) {
      setMessage(Homey.__('pair.fill_all'), 'error');
      return;
    }

    $('submit').disabled = true;
    setMessage(Homey.__('pair.checking'));

    try {
      // 1) Live valideren via de driver (haalt echte saldo/status op).
      const card = await Homey.emit('validate_card', { cardNumber, cardSequenceNumber });

      // 2) Device aanmaken; kaartgegevens gaan naar settings.
      await Homey.createDevice({
        name,
        data: { id: `${cardNumber}-${cardSequenceNumber}` },
        settings: {
          cardNumber,
          cardSequenceNumber,
          expiryDate: card.expiryDate ? new Date(card.expiryDate).toISOString() : '',
        },
      });

      setMessage(Homey.__('pair.added'), 'ok');
      Homey.done();
    } catch (err) {
      setMessage(Homey.__('pair.error_prefix') + (err && err.message ? err.message : err), 'error');
      $('submit').disabled = false;
    }
  }

  $('submit').addEventListener('click', onSubmit);

  // Verplicht: vertelt Homey dat de view klaar is met laden.
  Homey.ready();
</script>
