    <text x="286" y="490" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff" opacity="0.9">OV-PAS</text>
    <text x="286" y="700" font-family="Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff">&#8364;35,-</text>
    <text x="290" y="740" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" opacity="0.85">Saldo</text>
  </g>
