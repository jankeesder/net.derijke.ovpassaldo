<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f42d94"/>
      <stop offset="1" stop-color="#d1006e"/>
    </linearGradient>
  </defs>

  <!-- Alleen de kaart op een witte achtergrond -->
  <rect x="0" y="0" width="1000" height="1000" fill="#ffffff"/>

  <g transform="translate(0,-60) rotate(-8 500 560)">
    <rect x="238" y="446" width="524" height="330" rx="34" fill="#000" opacity="0.12"/>
    <rect x="230" y="438" width="524" height="330" rx="34" fill="url(#card)"/>
    <!-- chip -->
    <rect x="286" y="516" width="92" height="70" rx="12" fill="#f2c94c"/>
    <path d="M286 551 h92 M332 516 v70" stroke="#c99b1f" stroke-width="4"/>
