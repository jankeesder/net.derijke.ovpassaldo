    <linearGradient id="reader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffcf2e"/>
      <stop offset="1" stop-color="#e9a900"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="700" fill="url(#bg)"/>
  <ellipse cx="400" cy="360" rx="460" ry="360" fill="url(#glow)"/>

  <!-- ===================== INCHECK-LEZER (rechts) ===================== -->
  <g>
    <ellipse cx="760" cy="612" rx="150" ry="26" fill="#000" opacity="0.10"/>
    <rect x="648" y="150" width="230" height="452" rx="40" fill="url(#reader)"/>
